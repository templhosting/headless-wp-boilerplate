name: templ-headless

# Every container that loads WordPress shares this environment. It has to be
# shared rather than repeated: wp-config.php eval()s WORDPRESS_CONFIG_EXTRA out
# of the environment, so a WP-CLI container missing it runs against a silently
# different configuration than the web server. That is how `wp site create`
# came to hand a new subsite the wrong theme.
x-wordpress-env: &wordpress-env
  TEMPL_HEADLESS_PORT: "${TEMPL_HEADLESS_PORT:-8080}"
  # Single-site is the default. Set TEMPL_HEADLESS_MULTISITE=1 (and reprovision
  # with `composer dev:reset:multisite`) to stand up the subdirectory network
  # instead. init.sh reads this to choose between `wp core install` and `wp core
  # multisite-install`, and to decide whether to create the sample subsite.
  TEMPL_HEADLESS_MULTISITE: "${TEMPL_HEADLESS_MULTISITE:-0}"
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    // Printing errors to the page sends the headers, and core skips the
    // fatal error template once they are sent. With this on, the dev site
    // can never show a critical error page. Errors still reach the log.
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    // No plugin or theme installs, updates or file edits from the admin.
    // This repo is the only source of code on the network, and a site that
    // can rewrite its own wp-content is a site the repo no longer describes.
    //
    // Dev only. It also switches off the core automatic updates that
    // mu-plugins/templ-updates.php exists to restore, so copying this block
    // into a production wp-config.php would quietly undo that plugin. The
    // dev stack wants updates off anyway: core here comes from a pinned
    // image, and a site that updated itself would no longer match it.
    define( 'DISALLOW_FILE_MODS', true );
    // Makes the headless theme the default for any new site. On single-site
    // this is what the one site boots with; under multisite it has no
    // "activate this theme everywhere" switch, only an allowlist, so this is
    // what makes a site created from Network Admin headless the moment it
    // exists, with no activation step.
    define( 'WP_DEFAULT_THEME', 'templ-headless-theme' );
    // The MULTISITE constants are deliberately absent even when the multisite
    // path runs: `wp core multisite-install` appends its own block to
    // wp-config.php, and defining them here as well makes PHP warn about every
    // one of them on every request for the life of the container.

# The wp-content overlay. WordPress core lives in the named volume and stays
# out of git; this repo owns nothing but the code it ships. Every container
# that loads WordPress needs the same view of it, or a plugin is missing on one
# side and present on the other.
#
# Mounted directory by directory rather than ./wp-content over the whole of
# wp-content, deliberately. The image copies core's own wp-content into the
# document root on first boot, and uploads are written there for the life of
# the site; a single mount would land both in the working tree.
x-wp-content: &wp-content
  - wordpress:/var/www/html
  - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
  - ./wp-content/plugins/templ-contact-form:/var/www/html/wp-content/plugins/templ-contact-form
  - ./wp-content/plugins/templ-newsletter:/var/www/html/wp-content/plugins/templ-newsletter
  - ./wp-content/themes/templ-headless-theme:/var/www/html/wp-content/themes/templ-headless-theme

services:
  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    # Pinned on purpose: an unpinned tag turns a WordPress release into a red
    # integration suite on an unrelated commit. Bump deliberately, together
    # with `Requires at least` in every plugin and theme header and
    # minimum_wp_version in phpcs.xml.
    image: docker.io/library/wordpress:7.1-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host and container port are deliberately the same number: home_url()
      # carries the host port, and loopback requests from inside the container
      # have to resolve that same URL. Override both at once with
      # TEMPL_HEADLESS_PORT in .env when another stack already owns 8080.
      - "${TEMPL_HEADLESS_PORT:-8080}:${TEMPL_HEADLESS_PORT:-8080}"
    environment: *wordpress-env
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/plugins/templ-contact-form:/var/www/html/wp-content/plugins/templ-contact-form
      - ./wp-content/plugins/templ-newsletter:/var/www/html/wp-content/plugins/templ-newsletter
      - ./wp-content/themes/templ-headless-theme:/var/www/html/wp-content/themes/templ-headless-theme
      - ./tools/apache-loopback.conf:/etc/apache2/conf-enabled/templ-loopback.conf:ro
      - ./tools/php-dev.ini:/usr/local/etc/php/conf.d/zz-templ-dev.ini:ro

  # Idempotent provisioning: installs the site (single-site by default, or the
  # subdirectory network when TEMPL_HEADLESS_MULTISITE=1), creates the sample
  # subsite under multisite, and activates the theme and plugins. Runs on every
  # `up` and does nothing on the second run.
  init:
    image: docker.io/wordpress:cli-php8.3
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    user: "33:33"
    restart: "no"
    environment:
      <<: *wordpress-env
      SITE_URL: "http://localhost:${TEMPL_HEADLESS_PORT:-8080}"
      # Slug of the sample subsite created under multisite. Forwarded here
      # rather than in the anchor because it is provisioning input, like
      # SITE_URL, and never reaches wp-config.
      SAMPLE_SITE_SLUG: "${SAMPLE_SITE_SLUG:-customer-one}"
      SAMPLE_SITE_TITLE: "${SAMPLE_SITE_TITLE:-Customer One}"
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/plugins/templ-contact-form:/var/www/html/wp-content/plugins/templ-contact-form
      - ./wp-content/plugins/templ-newsletter:/var/www/html/wp-content/plugins/templ-newsletter
      - ./wp-content/themes/templ-headless-theme:/var/www/html/wp-content/themes/templ-headless-theme
      - ./tools/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  # WP-CLI against the running network. Reaching a subsite always needs --url:
  #   podman compose run --rm cli wp site list
  #   podman compose run --rm cli wp templ-headless key list --url=http://localhost:8080/customer-one/
  cli:
    image: docker.io/wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    # Borrows the web container's network stack so that loopback requests to
    # home_url() resolve, which is what the apache-loopback.conf Listen is for.
    network_mode: "service:wordpress"
    user: "33:33"
    working_dir: /var/www/html
    environment: *wordpress-env
    volumes: *wp-content

  # Dependency management and host-independent PHP tooling. There is no host
  # PHP requirement anywhere in this repo:
  #   podman compose run --rm composer install
  #   podman compose run --rm lint
  composer:
    image: docker.io/library/composer:2
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app

  lint:
    image: docker.io/library/composer:2
    profiles: ["tools"]
    working_dir: /app
    entrypoint: ["php", "vendor/bin/phpcs"]
    volumes:
      - .:/app

  # The pure-unit suite. WordPress is mocked with Brain Monkey, so this needs
  # no database and no running site, only the vendor tree.
  #   podman compose run --rm unit
  unit:
    image: docker.io/library/composer:2
    profiles: ["tools"]
    working_dir: /app
    entrypoint: ["php", "vendor/bin/phpunit", "-c", "phpunit.xml"]
    volumes:
      - .:/app

  # The integration suite: real HTTP against the running site. It shares the web
  # container's network stack, so a loopback request to home_url() reaches
  # Apache and the Authorization header survives the round trip. The repo is
  # mounted so phpunit and the vendor tree are present alongside wp-load.php.
  #   podman compose run --rm tests
  tests:
    image: docker.io/wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    network_mode: "service:wordpress"
    user: "33:33"
    working_dir: /app
    environment:
      <<: *wordpress-env
      # Reaches the dev site over the shared network stack, bypassing the host
      # port so the suite does not depend on TEMPL_HEADLESS_PORT being free.
      TEMPL_SITE_INTERNAL_URL: "http://localhost:${TEMPL_HEADLESS_PORT:-8080}"
      # The suite has to look for the subsite init.sh actually created, so this
      # forwards the same SAMPLE_SITE_SLUG knob. Without it an overridden slug
      # provisions one site and the tests go looking for another.
      TEMPL_SAMPLE_SITE_SLUG: "${SAMPLE_SITE_SLUG:-customer-one}"
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/plugins/templ-contact-form:/var/www/html/wp-content/plugins/templ-contact-form
      - ./wp-content/plugins/templ-newsletter:/var/www/html/wp-content/plugins/templ-newsletter
      - ./wp-content/themes/templ-headless-theme:/var/www/html/wp-content/themes/templ-headless-theme
      - .:/app
    entrypoint: ["php", "/app/vendor/bin/phpunit", "-c", "/app/phpunit-integration.xml"]

  # The multisite suite: the same running network, tests that cross site
  # boundaries.
  #   podman compose run --rm tests-multisite
  tests-multisite:
    image: docker.io/wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    network_mode: "service:wordpress"
    user: "33:33"
    working_dir: /app
    environment:
      <<: *wordpress-env
      TEMPL_SITE_INTERNAL_URL: "http://localhost:${TEMPL_HEADLESS_PORT:-8080}"
      TEMPL_SAMPLE_SITE_SLUG: "${SAMPLE_SITE_SLUG:-customer-one}"
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/plugins/templ-contact-form:/var/www/html/wp-content/plugins/templ-contact-form
      - ./wp-content/plugins/templ-newsletter:/var/www/html/wp-content/plugins/templ-newsletter
      - ./wp-content/themes/templ-headless-theme:/var/www/html/wp-content/themes/templ-headless-theme
      - .:/app
    entrypoint: ["php", "/app/vendor/bin/phpunit", "-c", "/app/phpunit-multisite.xml"]

  # The `Requires PHP` floor, on the interpreter itself: every file has to
  # parse. phpcs answers the same question statically and in more detail, but
  # only as well as the sniff database it ships, and that has been years stale
  # before now.
  #
  # Pinned to the floor rather than to a range, so bumping `Requires PHP`
  # without bumping this fails loudly instead of quietly testing the wrong
  # version.
  #   podman compose run --rm php-floor
  php-floor:
    image: docker.io/library/php:8.3-cli
    profiles: ["tools"]
    working_dir: /app
    entrypoint: ["sh", "/app/tools/check-php-floor.sh"]
    volumes:
      - .:/app

volumes:
  db:
  wordpress:
