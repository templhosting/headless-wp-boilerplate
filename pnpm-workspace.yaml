# templ-deploy pulls in ssh2, whose native build is optional: the deploy shells
# out to the system rsync and ssh, so the compiled binding is never on the path
# that runs. Both builds are declined deliberately.
#
# These have to be answered explicitly. pnpm writes the keys here with a
# placeholder value and then fails the install with ERR_PNPM_IGNORED_BUILDS
# until each one is a real boolean -- and because `pnpm run deploy` installs
# first, an unanswered placeholder breaks deployment, not just `pnpm install`.
allowBuilds:
  cpu-features: false
  ssh2: false
