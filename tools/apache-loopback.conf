# The network's home_url is http://localhost:$TEMPL_HEADLESS_PORT, which is the
# host's port mapping rather than a port Apache listens on, so nothing inside
# the container can reach the site at the URL WordPress believes it lives at.
# The integration and multisite suites make real HTTP requests to home_url(),
# so without this every one of them connects to a closed port.
#
# The variable is expanded by Apache from the process environment, and
# compose.yaml always sets it, so an unset value cannot silently listen on the
# wrong port -- Apache refuses to start instead.
Listen ${TEMPL_HEADLESS_PORT}
