; Dev container only.
;
; The stock image caches file timestamps for two seconds. Against a bind mount
; that means an edit on the host, or a file a test writes, can be served from
; the previous compiled copy. Tests then fail for reasons that have nothing to
; do with the code under test, which is the worst kind of red suite.
;
; Production keeps the default.
opcache.revalidate_freq = 0
